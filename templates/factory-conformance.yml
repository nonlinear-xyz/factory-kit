# Factory conformance — a guardrail at the PR boundary, never the inner loop.
#
# Runs factory-kit-check against the PR, posts ONE sticky scorecard comment
# (updated in place on each push), and fails the check only when the PR
# introduces a NEW critical-severity finding. Pre-existing debt never blocks —
# the gate is on the delta, the comment carries the absolute context.
#
# Installed by `npx @nonlinear-labs/factory-kit add-ci`. Tune the gate in
# `.factory-check.json` (`"gateOnHigh": true` to also block new highs).
name: Factory conformance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the base ref resolves for the delta

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Render the scorecard. `--md` prints the comment body to stdout; the CLI
      # exits non-zero on a new-critical, which we capture (not fail) here so the
      # comment always posts. The dedicated gate step below does the failing.
      - name: Run factory-kit-check
        run: |
          set -o pipefail
          npx -y -p @nonlinear-labs/factory-kit factory-kit-check . \
            --base "origin/${{ github.base_ref }}" --md > scorecard.md \
            && echo "GATE=pass" >> "$GITHUB_ENV" \
            || echo "GATE=block" >> "$GITHUB_ENV"
          cat scorecard.md

      - name: Post sticky scorecard
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('scorecard.md', 'utf8');
            const marker = '<!-- factory-kit-check:scorecard -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The load-bearing guardrail: fail the required check only on a new critical.
      - name: Enforce delta gate
        if: env.GATE == 'block'
        run: |
          echo "::error::This PR introduces a new critical-severity finding. See the conformance scorecard on the PR."
          exit 1
